services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dojo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: starcraft_dojo
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init/02-readonly-role.sh:/docker-entrypoint-initdb.d/02-readonly-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojo -d starcraft_dojo"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Postgres is NOT published to the host by default. For Looker Studio on the
    # VPS, uncomment the mapping below AND restrict 5432 with your firewall.
    # ports:
    #   - "5432:5432"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/starcraft_dojo
      DATABASE_URL_RO: postgres://dojo_readonly:${READONLY_DB_PASSWORD}@db:5432/starcraft_dojo
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # AUTH_PASSWORD_HASH y MY_ALIASES ya no los usa la app: identidad y alias
      # viven en la base (users / player_aliases). Solo los lee una vez
      # `pnpm migrate:multiuser` al migrar del modo mono-usuario.
    volumes:
      - replays:/data/replays
      # Full (untruncated) tileset graphics for terrain rendering — generated
      # with `pnpm extract-bwdata --tilesets`, Blizzard-owned, never in images.
      - ./data/bwtiles:/data/replays/bwtiles:ro
    ports:
      - "127.0.0.1:3000:3000"   # localhost only — safe on the VPS too (Caddy proxies internally)

  # Capa B: re-simulates every replay with OpenBW and writes the sampled unit +
  # economy timeline the viewer plays back. `./data/bwdata` holds the Blizzard
  # game data (generate it with `pnpm extract-bwdata`) — bind-mounted read-only,
  # never baked into an image. See README "Capa B — re-simulación".
  resim:
    build: ./resim
    restart: unless-stopped
    user: "100:101"                # same uid/gid as the web container's `dojo`
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dojo:${POSTGRES_PASSWORD}@db:5432/starcraft_dojo
      BWDATA_DIR: /bwdata
      REPLAYS_DIR: /data/replays
    volumes:
      - replays:/data/replays
      - ./data/bwdata:/bwdata:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]          # only started on the VPS: docker compose --profile prod up -d
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  replays:
  caddy_data:
  caddy_config:
